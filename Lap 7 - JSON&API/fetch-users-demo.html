<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เปรียบเทียบ Promise กับ Async/Await</title>
  <!-- Google Fonts: Prompt for Thai-English readability -->
  <link
    href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&family=JetBrains+Mono:wght@400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --slate-900: #0f172a;
      --slate-800: #1e293b;
      --indigo-500: #6366f1;
      --indigo-400: #818cf8;
      --emerald-500: #10b981;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      --bg-gradient: radial-gradient(circle at top left, #1e293b, #0f172a);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Prompt', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      padding: 20px;
    }

    .container {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2.5rem;
      border-radius: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 600px;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-main);
      letter-spacing: -0.025em;
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    button {
      padding: 0.875rem;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-promise {
      background: rgba(99, 102, 241, 0.1);
      color: var(--indigo-400);
    }

    .btn-promise:hover {
      background: var(--indigo-500);
      color: white;
      transform: translateY(-2px);
    }

    .btn-async {
      background: rgba(16, 185, 129, 0.1);
      color: var(--emerald-500);
    }

    .btn-async:hover {
      background: var(--emerald-500);
      color: white;
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(0.98);
    }

    .list-container {
      background: rgba(15, 23, 42, 0.5);
      border-radius: 1.25rem;
      padding: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
      max-height: 400px;
      overflow-y: auto;
    }

    ul {
      list-style: none;
    }

    li {
      padding: 0.75rem 1rem;
      margin-bottom: 0.5rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 0.5rem;
      border-left: 3px solid var(--indigo-500);
      animation: slideIn 0.3s ease-out forwards;
      opacity: 0;
      display: flex;
      align-items: center;
      font-size: 1.1rem;
    }

    li::before {
      content: '👤';
      margin-right: 0.75rem;
      font-size: 0.9rem;
    }

    li:nth-child(even) {
      border-left-color: var(--emerald-500);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-10px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .placeholder {
      text-align: center;
      color: var(--text-dim);
      padding: 2rem 0;
      font-style: italic;
    }

    /* Loading indicator */
    .loading {
      display: none;
      text-align: center;
      margin-bottom: 1rem;
      color: var(--indigo-400);
      font-weight: 500;
    }

    /* Custom scrollbar */
    .list-container::-webkit-scrollbar {
      width: 6px;
    }

    .list-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }
  </style>
</head>

<body>

  <div class="container">
    <header>
      <h1>เปรียบเทียบ Promise กับ Async/Await</h1>
    </header>

    <div class="btn-group">
      <button class="btn-promise" onclick="loadUsersPromise()">
        <span>📦</span> โหลดแบบ Promise
      </button>
      <button class="btn-async" onclick="loadUsersAsync()">
        <span>⚡</span> โหลดแบบ Async/Await
      </button>
    </div>

    <div id="status" class="loading">กำลังโหลดข้อมูล...</div>

    <div class="list-container">
      <ul id="userList">
        <div class="placeholder">ยังไม่มีข้อมูล... กดปุ่มเพื่อเริ่มโหลด</div>
      </ul>
    </div>
  </div>

  <script>
    // API สำหรับทดลอง
    const API_URL = "https://jsonplaceholder.typicode.com/users";
    const userList = document.getElementById("userList");
    const statusText = document.getElementById("status");

    function showLoading() {
      statusText.style.display = "block";
      userList.innerHTML = "";
    }

    function hideLoading() {
      statusText.style.display = "none";
    }

    function renderUsers(users) {
      userList.innerHTML = "";
      users.forEach((user, index) => {
        const li = document.createElement("li");
        li.textContent = user.name;
        li.style.animationDelay = `${index * 50}ms`;
        userList.appendChild(li);
      });
    }

    // Promise (.then)
    function loadUsersPromise() {
      showLoading();
      // เรียก API
      fetch(API_URL) // fetch ส่ง request ไปยัง API และคืนค่าเป็น Promise
        .then(res => res.json()) // .then ตัวที่ 1 จะทำงานเมื่อ Promise สำเร็จ (แปลง JSON เป็น Object)
        .then(users => {
          // .then ตัวที่ 2 จะทำงานเมื่อ JSON แปลงเสร็จ
          hideLoading();
          renderUsers(users);
        })
        .catch(err => {
          hideLoading();
          userList.innerHTML = `<li style="border-left-color: #ef4444; color: #fca5a5;">เกิดข้อผิดพลาด: ${err.message}</li>`;
        });
    }

    // async / await
    async function loadUsersAsync() {
      showLoading();
      try {
        // เรียก API
        const res = await fetch(API_URL);
        // แปลง JSON เป็น Object
        const users = await res.json(); // await รอผลลัพธ์จาก Promise แบบ non-blocking

        hideLoading();
        renderUsers(users);
      } catch (err) {
        hideLoading();
        userList.innerHTML = `<li style="border-left-color: #ef4444; color: #fca5a5;">เกิดข้อผิดพลาด: ${err.message}</li>`;
      }
    }
  </script>

</body>

</html>

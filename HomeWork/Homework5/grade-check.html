<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>Grade Check</title>
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            padding: 20px;
            background-color: #f3f3f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            border-left: 5px solid #ffa200;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            color: #333;
            margin-top: 0;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        button {
            background-color: #ffa200;
            color: white;
            padding: 12px 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
            width: 100%;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #ffa200;
        }

        #outputBox {
            margin-top: 20px;
            font-size: 18px;
            line-height: 1.8;
            color: #444;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #e9ecef;
        }

        .grade-a {
            color: #28a745;
            font-weight: bold;
        }

        .grade-f {
            color: #dc3545;
            font-weight: bold;
        }

        .pass {
            color: #28a745;
        }

        .fail {
            color: #dc3545;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>โปรแกรมตรวจสอบเกรด</h2>
        <p>กดปุ่มเพื่อสุ่มคะแนนและดูผลลัพธ์</p>
        <button onclick="checkGrade()">สุ่มคะแนนและตัดเกรด</button>
        <div id="outputBox">ผลลัพธ์จะแสดงที่นี่...</div>
    </div>

    <script>
        function checkGrade() {
            // 1. สุ่มคะแนน 0-100
            let score = Math.floor(Math.random() * 101);
            let grade = "";
            let result = "";

            // 2. ตัดเกรดตามเงื่อนไข (if/else)
            if (score >= 80) grade = "A";
            else if (score >= 70) grade = "B";
            else if (score >= 60) grade = "C";
            else if (score >= 50) grade = "D";
            else grade = "F";

            // 3. ตรวจสอบ ผ่าน/ไม่ผ่าน
            if (score >= 50) result = "ผ่าน";
            else result = "ไม่ผ่าน";

            // จัดเตรียม Class สำหรับสีข้อความ
            let gradeClass = (grade === "F") ? "grade-f" : "grade-a";
            let resultClass = (result === "ผ่าน") ? "pass" : "fail";

            // 4. แสดงผลสวยงามด้วย innerHTML
            document.getElementById("outputBox").innerHTML = `
            คะแนนที่ได้: <b>${score}</b> คะแนน<br>
            ได้เกรด: <span class="${gradeClass}">${grade}</span><br>
            ผลการสอบ: <span class="${resultClass}">${result}</span>
        `;

            // 5. แสดงผลใน Console ตามโจทย์
            console.clear();
            console.log("คะแนน:", score);
            console.log("เกรด:", grade);
            console.log("ผลสอบ:", result);
        }
    </script>

</body>

</html>
